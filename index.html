
  <!DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <meta name="description" content="Sistema de Gestión Veterinaria - Administración de clínicas para mascotas" />
      <meta name="theme-color" content="#2d6a4f" />

      <!-- Open Graph -->
      <meta property="og:title" content="VetClinic - Sistema de Gestión Veterinaria" />
      <meta property="og:description" content="Administración integral de clínicas veterinarias" />
      <meta property="og:type" content="website" />

      <title>VetClinic 🐾 - Sistema de Gestión Veterinaria</title>

      <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />

      <style>
        html, body {
          height: 100%;
          margin: 0;
          padding: 0;
          font-family: system-ui, -apple-system, sans-serif;
        }
        #root { height: 100%; }

        /* Smooth scrolling */
        html {
          scroll-behavior: smooth;
        }

        /* Neutralino drag region */
        .platform-windows header,
        .platform-linux header {
          -webkit-app-region: drag;
        }
        .platform-windows header button,
        .platform-linux header button {
          -webkit-app-region: no-drag;
        }

        /* Animaciones de entrada */
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
          animation: fadeIn 0.3s ease-out;
        }
      </style>
    </head>

    <body>
      <div id="root"></div>

      <!-- Neutralino.js - Solo se carga si el runtime está presente -->
      <script src="/neutralino.js" onerror="console.log('Neutralino no disponible - modo web')"></script>

      <!-- Punto de entrada principal -->
      <script type="module" src="./src/main.tsx"></script>
    </body>
  </html>
